# Valeurs locales pour initialiser le client LDAP sans serveur LDAP.
# Les appels qui interrogent l'annuaire ne fonctionnent pas dans cet environnement.
ldapOrgsRdn=ou=orgs
ldapBaseDn=dc=example,dc=org
ldapScheme=ldap
ldapHost=127.0.0.1
ldapPort=389
ldapAdminDn=cn=unused,dc=example,dc=org
ldapAdminPassword=unused
